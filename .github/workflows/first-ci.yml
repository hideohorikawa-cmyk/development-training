name: First CI

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check lesson2 files
        run: |
          test -f lesson2/index.html
          test -f lesson2/Containerfile
          echo "Required files exist!"

      - name: Build container image
        run: |
          cd lesson2
          podman build -t ghcr.io/${{ github.repository_owner }}/development-training:latest .

      - name: Login to GHCR
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Push container image
        if: github.event_name == 'push'
        run: |
          podman push ghcr.io/${{ github.repository_owner }}/development-training:latest